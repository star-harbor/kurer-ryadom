<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курьер рядом</title>
<meta name="description" content="Подработка курьером рядом с домом. Выберите, где вам удобно написать: Telegram, MAX или ВКонтакте.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="avatar.png">
<meta property="og:title" content="Подработка курьером рядом с домом">
<meta property="og:description" content="Напишите нам в удобный мессенджер. Расскажем условия и запишем на обучение.">
<meta property="og:image" content="avatar.png">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15181e;
    --muted: #5d6675;
    --line: #e3e6ec;
    --accent: #1c9a5b;
    --accent-text: #ffffff;
    --tg: #2a9fd8;
    --max: #6b4eff;
    --vk: #2787f5;
    --soft: #eaf6ef;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216;
      --card: #181c22;
      --text: #eef1f5;
      --muted: #9aa4b2;
      --line: #272d36;
      --accent: #34c27b;
      --accent-text: #0b1a12;
      --soft: #14281e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 28px; line-height: 1.15; margin: 8px 0 8px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .accepted {
    background: var(--soft); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 20px; font-weight: 600;
  }
  .perks { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 10px; }
  .perks li {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
  }
  .perks li > span:first-child { flex: none; width: 28px; text-align: center; font-size: 20px; line-height: 1.3; }
  .perks b { display: block; }
  .perks span { color: var(--muted); font-size: 14px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .btns { display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; border-radius: 16px; font-size: 18px; font-weight: 700;
    text-decoration: none; color: #fff; border: 0;
    transition: transform .08s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.tg { background: #229ED9; }
  .btn.max { background: linear-gradient(135deg, #2D9CFF 0%, #8F3CFF 100%); }
  .btn.vk { background: #0077FF; }
  .btn small { font-weight: 500; opacity: .9; font-size: 13px; }
  .soon-note {
    display: none; margin: 0 0 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
  .top { display: grid; gap: 14px; margin: 0 0 14px; }
  .top .btn {
    min-height: 72px; font-size: 21px; border-radius: 18px; gap: 12px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .22);
    -webkit-tap-highlight-color: transparent;
  }
  .top .btn:active { box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transform: translateY(2px); }
  .ic { width: 32px; height: 32px; flex: none; }
  .foot { margin: 0 4px 26px; }
  .btn small { background: rgba(255, 255, 255, .22); padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .wrap { text-align: center; }
  .perks li { flex-direction: column; align-items: center; gap: 4px; padding: 14px; }
  .perks li > span:first-child { width: auto; font-size: 24px; }
  .perks li > div { text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <div class="accepted">✅ Мы приняли ваш отклик</div>
  <p class="lead">Напишите нам в удобный мессенджер. Расскажем условия и запишем на обучение, это займёт пару минут.</p>

  <p class="soon-note" id="soon"></p>

  <div class="top">
    <a class="btn tg" id="b-tg" href="https://t.me/kurer_ryadom_bot">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 3.3 2.9 10.5c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.3 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.9c.3-1.2-.5-1.8-1.3-1.4zM8.9 13.1l9.8-6.2c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-1.9-4.7z"/></svg>
      <span>Telegram</span>
    </a>
    <a class="btn max" id="b-max" href="https://max.ru/se14822982_bot">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c-5.2 0-9.5 3.9-9.5 8.8 0 2.6 1.2 4.9 3.1 6.5v3.2l3-1.7c1.1.3 2.3.5 3.4.5 5.2 0 9.5-3.9 9.5-8.8S17.200 2.500 12 2.500zm-3.800 11V9h1.500l2.300 3 2.300-3h1.500v4.500h-1.400v-2.600l-2.400 3h-.100l-2.400-3v2.600z"/></svg>
      <span>MAX</span>
    </a>
    <a class="btn vk" id="b-vk" href="https://vk.me/kurer_ryadom">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16.500" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="currentColor">VK</text></svg>
      <span>ВКонтакте</span>
    </a>
  </div>

  <p class="foot">Нажимая кнопку, вы переходите в чат с помощником. Он задаст несколько вопросов и передаст заявку менеджеру.</p>

</main><script>
  (function () {
    var p = new URLSearchParams(location.search);
    var c = (p.get('c') || '').replace(/[^\w-]/g, '').slice(0, 64);
    // Метка кандидата из ссылки (?c=...) уходит в бота как стартовый параметр.
    // ВКонтакте передаёт метку в параметре ref, остальные мессенджеры в start.
    var links = {
      tg: ['https://t.me/kurer_ryadom_bot', 'start'],
      max: ['https://max.ru/se14822982_bot', 'start'],
      vk: ['https://vk.me/kurer_ryadom', 'ref']
    };
    ['tg', 'max', 'vk'].forEach(function (k) {
      document.getElementById('b-' + k).href = links[k][0] + (c ? '?' + links[k][1] + '=' + encodeURIComponent(c) : '');
    });
  })();
</script>
</body>
</html>
